            biometrische Lesegeräte
        fr:
          description: Systèmes de gestion des identités et logiciels et dispositifs de gestion des accès privilégiés,
            dont lecteurs d’authentification et de contrôle d’accès et lecteurs biométriques
    - urn: urn:intuitem:risk:req_node:cra-resolution-annexes:3.1.2
      assessable: true
