    requirement_nodes:
    - urn: urn:intuitem:risk:req_node:cra-resolution-annexes:1
      assessable: false
      depth: 1
      ref_id: '1'
      name: ANNEX I
      description: ESSENTIAL CYBERSECURITY REQUIREMENTS
      translations:
        de:
          name: ANHANG I
          description: GRUNDLEGENDE CYBERSECURITYANFORDERUNGEN
        fr:
          name: ANNEXE I
          description: EXIGENCES ESSENTIELLES DE CYBERSÉCURITÉ
    - urn: urn:intuitem:risk:req_node:cra-resolution-annexes:1.1
      assessable: false
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:cra-resolution-annexes:1
      ref_id: '1.1'
      name: Part I
      description: Cybersecurity requirements relating to the properties of products with digital elements
      translations:
        de:
          name: Teil I
          description: Cybersicherheitsanforderungen in Bezug auf die Eigenschaften von Produkten mit digitalen
            Elementen
        fr:
          name: Partie I
          description: Exigences de cybersécurité relatives aux propriétés des produits comportant des éléments
            numériques
    - urn: urn:intuitem:risk:req_node:cra-resolution-annexes:1.1.1
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:cra-resolution-annexes:1.1
      ref_id: 1.1.1
      description: Products with digital elements shall be designed, developed and produced in such a way that they
        ensure an appropriate level of cybersecurity based on the risks.
      translations:
        de:
          description: Produkte mit digitalen Elementen werden so konzipiert, entwickelt und hergestellt, dass sie
            angesichts der Risiken ein angemessenes Cybersicherheitsniveau gewährleisten.
        fr:
          description: Les produits comportant des éléments numériques sont conçus, développés et fabriqués de manière
            à garantir un niveau de cybersécurité approprié en fonction des risques.
    - urn: urn:intuitem:risk:req_node:cra-resolution-annexes:1.1.2
      assessable: false
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:cra-resolution-annexes:1.1
      ref_id: 1.1.2
      description: 'On the basis of the cybersecurity risk assessment referred to in Article 13(2) and where applicable,
        products with digital elements shall:'
      translations:
        de:
          description: Auf der Grundlage der Bewertung der Cybersicherheitsrisiken gemäß Artikel 13 Absatz 2 müssen
            Produkte mit digitalen Elementen, soweit zutreffend,
        fr:
          description: 'Sur la base de l’évaluation des risques de cybersécurité visée à l’article 13, paragraphe
            2, les produits comportant des éléments numériques doivent, le cas échéant:'
    - urn: urn:intuitem:risk:req_node:cra-resolution-annexes:1.1.2.a
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:cra-resolution-annexes:1.1.2
      ref_id: 1.1.2.a
      description: be made available on the market without known exploitable vulnerabilities;
      translations:
        de:
          description: ohne bekannte ausnutzbare Schwachstellen auf dem Markt bereitgestellt werden,
        fr:
          description: être mis à disposition sur le marché sans vulnérabilité exploitable connue;
    - urn: urn:intuitem:risk:req_node:cra-resolution-annexes:1.1.2.b
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:cra-resolution-annexes:1.1.2
      ref_id: 1.1.2.b
      description: be made available on the market with a secure by default configuration, unless otherwise agreed
        between manufacturer and business user in relation to a tailor-made product with digital elements, including
        the possibility to reset the product to its original state;
      translations:
        de:
          description: mit einer sicheren Standardkonfiguration auf dem Markt bereitgestellt werden, sofern zwischen
            dem Hersteller und dem gewerblichen Nutzer in Bezug auf ein maßgeschneidertes Produkt mit digitalen
            Elementen nichts anderes vereinbart wurde, und die Möglichkeit bieten, das Produkt in seinen ursprünglichen
            Zustand zurückzusetzen,
        fr:
          description: être mis à disposition sur le marché avec une configuration de sécurité par défaut, sauf
            accord contraire entre le fabricant et l’entreprise utilisatrice en ce qui concerne un produit sur mesure
            comportant des éléments numériques, y compris la possibilité de réinitialiser le produit à son état
            d’origine;
    - urn: urn:intuitem:risk:req_node:cra-resolution-annexes:1.1.2.c
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:cra-resolution-annexes:1.1.2
      ref_id: 1.1.2.c
      description: ensure that vulnerabilities can be addressed through security updates, including, where applicable,
        through automatic security updates that are installed within an appropriate timeframe enabled as a default
        setting, with a clear and easy-to-use opt-out mechanism, through the notification of available updates to
        users, and the option to temporarily postpone them;
      translations:
        de:
          description: sicherstellen, dass Schwachstellen durch Sicherheitsaktualisierungen behoben werden können,
            gegebenenfalls auch durch automatische Sicherheitsaktualisierungen, die als Standardeinstellung innerhalb
            eines angemessenen Zeitrahmens installiert werden sowie über einen klaren und benutzerfreundlichen Opt-out-Mechanismus
            verfügen, bei dem die Nutzer über verfügbare Aktualisierungen informiert werden und sie vorübergehend
            verschieben können;
        fr:
          description: être conçus de façon à ce que leurs vulnérabilités puissent être corrigées par des mises
            à jour de sécurité, y compris, le cas échéant, par des mises à jour automatiques de sécurité régulières
            activées par défaut, mais faciles à désactiver, par la communication aux utilisateurs des mises à jour
            disponibles et par la possibilité de les différer temporairement;
    - urn: urn:intuitem:risk:req_node:cra-resolution-annexes:1.1.2.d
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:cra-resolution-annexes:1.1.2
      ref_id: 1.1.2.d
      description: ensure protection from unauthorised access by appropriate control mechanisms, including but not
        limited to authentication, identity or access management systems, and report on possible unauthorised access;
      translations:
        de:
          description: durch geeignete Kontrollmechanismen Schutz vor unbefugtem Zugriff bieten, darunter u. a.
            zumindest Authentifizierungs-, Identitäts- oder Zugangsverwaltungssysteme, und einen möglicherweise
            unbefugten Zugriff melden,
        fr:
          description: assurer la protection contre les accès non autorisés par des mécanismes de contrôle appropriés,
            y compris, mais sans s’y limiter, par des systèmes d’authentification, d’identité ou de gestion des
            accès et signaler tout accès non autorisé;
    - urn: urn:intuitem:risk:req_node:cra-resolution-annexes:1.1.2.e
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:cra-resolution-annexes:1.1.2
      ref_id: 1.1.2.e
      description: protect the confidentiality of stored, transmitted or otherwise processed data, personal or other,
        such as by encrypting relevant data at rest or in transit by state of the art mechanisms, and by using other
        technical means;
      translations:
        de:
          description: die Vertraulichkeit gespeicherter, übermittelter oder anderweitig verarbeiteter personenbezogener
            oder sonstiger Daten schützen, z. B. durch Verschlüsselung relevanter Daten, die gespeichert sind oder
            gerade verwendet oder übermittelt werden, durch modernste Mechanismen und durch den Einsatz anderer
            technischer Mittel,
        fr:
          description: protéger la confidentialité des données stockées, transmises ou traitées de toute autre manière,
            à caractère personnel ou autres, par exemple en chiffrant les données pertinentes au repos ou en transit
            au moyen de mécanismes de pointe et par d’autres moyens techniques;
    - urn: urn:intuitem:risk:req_node:cra-resolution-annexes:1.1.2.f
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:cra-resolution-annexes:1.1.2
      ref_id: 1.1.2.f
      description: protect the integrity of stored, transmitted or otherwise processed data, personal or other,
        commands, programs and configuration against any manipulation or modification not authorised by the user,
        and report on corruptions;
      translations:
        de:
          description: die Integrität gespeicherter, übermittelter oder anderweitig verarbeiteter Daten, ob personenbezogener
            oder sonstiger Daten, Befehle, Programme und Konfigurationen vor einer vom Nutzer nicht genehmigten
            Manipulation oder Veränderung schützen und deren Beschädigung melden,
        fr:
          description: protéger l’intégrité des données stockées, transmises ou traitées de toute autre manière,
            à caractère personnel ou autres, des commandes, des programmes et de la configuration contre toute manipulation
            ou modification non autorisée par l’utilisateur et signaler les corruptions;
    - urn: urn:intuitem:risk:req_node:cra-resolution-annexes:1.1.2.g
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:cra-resolution-annexes:1.1.2
      ref_id: 1.1.2.g
      description: process only data, personal or other, that are adequate, relevant and limited to what is necessary
        in relation to the intended purpose of the product with digital elements (data minimisation);
      translations:
        de:
          description: die Verarbeitung personenbezogener oder sonstiger Daten auf solche, die angemessen und von
            Bedeutung sind, und auf das für die Zweckbestimmung des Produkts mit digitalen Elementen erforderliche
            Maß beschränken („Datenminimierung“),
        fr:
          description: ne traiter que les données, à caractère personnel ou autres, qui sont adéquates, pertinentes
            et limitées à ce qui est nécessaire au regard de la finalité prévue du produit comportant des éléments
            numériques (minimisation des données);
    - urn: urn:intuitem:risk:req_node:cra-resolution-annexes:1.1.2.h
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:cra-resolution-annexes:1.1.2
      ref_id: 1.1.2.h
      description: protect the availability of essential and basic functions, also after an incident, including
        through resilience and mitigation measures against denial-of-service attacks;
      translations:
        de:
          description: die Verfügbarkeit wesentlicher und grundlegender Funktionen, auch nach einem Sicherheitsvorfall,
            einschließlich über Abwehr- und Eindämmungsmaßnahmen gegen Überlastungsangriffe auf Server (Denial-of-Service-Angriffe),
            sicherstellen,
        fr:
          description: protéger la disponibilité des fonctions essentielles et de base, notamment après un incident,
            y compris par des mesures de résilience et d’atténuation face aux attaques par déni de service;
    - urn: urn:intuitem:risk:req_node:cra-resolution-annexes:1.1.2.i
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:cra-resolution-annexes:1.1.2
      ref_id: 1.1.2.i
      description: minimise the negative impact by the products themselves or connected devices on the availability
        of services provided by other devices or networks;
      translations:
        de:
          description: die negativen Auswirkungen von den Produkten selbst oder von vernetzten Geräten auf die Verfügbarkeit
            der von anderen Geräten oder Netzen bereitgestellten Dienste minimieren,
        fr:
          description: réduire au maximum les répercussions négatives générées par les produits eux-mêmes ou par
            les appareils connectés sur la disponibilité des services fournis par d’autres dispositifs ou réseaux;
    - urn: urn:intuitem:risk:req_node:cra-resolution-annexes:1.1.2.j
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:cra-resolution-annexes:1.1.2
      ref_id: 1.1.2.j
      description: be designed, developed and produced to limit attack surfaces, including external interfaces;
      translations:
        de:
          description: so konzipiert, entwickelt und hergestellt werden, dass sie — auch bei externen Schnittstellen
            — möglichst geringe Angriffsflächen bieten,
        fr:
          description: être conçus, développés et fabriqués de manière à limiter les surfaces d’attaque, y compris
            les interfaces externes;
    - urn: urn:intuitem:risk:req_node:cra-resolution-annexes:1.1.2.k
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:cra-resolution-annexes:1.1.2
      ref_id: 1.1.2.k
      description: be designed, developed and produced to reduce the impact of an incident using appropriate exploitation
        mitigation mechanisms and techniques;
      translations:
        de:
          description: so konzipiert, entwickelt und hergestellt werden, dass die Auswirkungen eines Sicherheitsvorfalls
            durch geeignete Mechanismen und Techniken zur Minderung der möglichen Ausnutzung verringert werden,
        fr:
          description: être conçus, développés et fabriqués de manière à réduire les répercussions d’un incident,
            en utilisant des mécanismes et des techniques appropriés de limitation de l’exploitation de failles;
    - urn: urn:intuitem:risk:req_node:cra-resolution-annexes:1.1.2.l
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:cra-resolution-annexes:1.1.2
      ref_id: 1.1.2.l
      description: provide security related information by recording and monitoring relevant internal activity,
        including the access to or modification of data, services or functions, with an opt-out mechanism for the
        user;
      translations:
        de:
          description: sicherheitsbezogene Informationen durch Aufzeichnung und/oder Überwachung einschlägiger interner
            Vorgänge wie Zugang zu Daten, Diensten oder Funktionen und Änderungen daran bereitstellen und den Nutzern
            einen Opt-out-Mechanismus zur Verfügung stellen,
        fr:
          description: fournir des informations relatives à la sécurité en enregistrant et en surveillant les activités
            internes pertinentes, y compris l’accès ou la modification des données, des services ou des fonctions,
            tout en laissant à l’utilisateur la possibilité de désactiver le mécanisme;
    - urn: urn:intuitem:risk:req_node:cra-resolution-annexes:1.1.2.m
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:cra-resolution-annexes:1.1.2
      ref_id: 1.1.2.m
      description: provide the possibility for users to securely and easily remove on a permanent basis all data
        and settings and, where such data can be transferred to other products or systems, ensure that this is done
        in a secure manner.
      translations:
        de:
          description: den Nutzern die Möglichkeit bieten, alle Daten und Einstellungen dauerhaft sicher und einfach
            zu löschen, und, wenn diese Daten auf andere Produkte oder Systeme übertragen werden können, sicherstellen,
            dass dies auf sichere Weise geschieht.
        fr:
          description: donner aux utilisateurs la possibilité de supprimer facilement, en toute sécurité et de manière
            permanente toutes les données et tous les paramètres et, lorsque ces données peuvent être transférées
            vers d’autres produits ou systèmes, veiller à ce que cela puisse se faire de manière sécurisée.
    - urn: urn:intuitem:risk:req_node:cra-resolution-annexes:1.2
      assessable: false
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:cra-resolution-annexes:1
      ref_id: '1.2'
      name: Part II
      description: Vulnerability handling requirements
      translations:
        de:
          name: Teil II
          description: Anforderungen an die Behandlung von Schwachstellen
        fr:
          name: Partie II
          description: Exigences relatives à la gestion des vulnérabilités
    - urn: urn:intuitem:risk:req_node:cra-resolution-annexes:node20
      assessable: false
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:cra-resolution-annexes:1.2
      description: 'Manufacturers of products with digital elements shall:'
      translations:
        de:
          description: Die Hersteller von Produkten mit digitalen Elementen müssen
        fr:
          description: 'Les fabricants des produits comportant des éléments numériques:'
    - urn: urn:intuitem:risk:req_node:cra-resolution-annexes:1.2.1
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:cra-resolution-annexes:node20
      ref_id: 1.2.1
      description: identify and document vulnerabilities and components contained in products with digital elements,
        including by drawing up a software bill of materials in a commonly used and machine-readable format covering
        at the very least the top-level dependencies of the products;
      translations:
        de:
          description: Schwachstellen und Komponenten der Produkte mit digitalen Elementen ermitteln und dokumentieren,
            u. a. durch Erstellung einer Software-Stückliste in einem gängigen maschinenlesbaren Format, aus der
            zumindest die obersten Abhängigkeiten der Produkte hervorgehen;
        fr:
          description: recensent et documentent les vulnérabilités et les composants des produits, notamment par
            l’établissement d’une nomenclature des logiciels dans un format couramment utilisé et lisible par machine
            couvrant au moins les dépendances de niveau supérieur des produits;
    - urn: urn:intuitem:risk:req_node:cra-resolution-annexes:1.2.2
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:cra-resolution-annexes:node20
      ref_id: 1.2.2
      description: in relation to the risks posed to products with digital elements, address and remediate vulnerabilities
        without delay, including by providing security updates; where technically feasible, new security updates
        shall be provided separately from functionality updates;
      translations:
        de:
          description: im Hinblick auf die Risiken im Zusammenhang mit den Produkten mit digitalen Elementen unverzüglich
            Schwachstellen behandeln und beheben, unter anderem durch Bereitstellung von Sicherheitsaktualisierungen;
            soweit technisch machbar, müssen neue Sicherheitsaktualisierungen getrennt von den Funktionsaktualisierungen
            bereitgestellt werden;
        fr:
          description: gèrent et corrigent sans retard les vulnérabilités qui touchent les produits comportant des
            éléments numériques, y compris par des mises à jour de sécurité; lorsque cela est techniquement possible,
            de nouvelles mises à jour de sécurité sont fournies séparément des mises à jour de fonctionnalité;
    - urn: urn:intuitem:risk:req_node:cra-resolution-annexes:1.2.3
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:cra-resolution-annexes:node20
      ref_id: 1.2.3
      description: apply effective and regular tests and reviews of the security of the product with digital elements;
      translations:
        de:
          description: die Sicherheit des Produkts mit digitalen Elementen regelmäßig und wirksam testen und überprüfen;
        fr:
          description: soumettent régulièrement les produits comportant des éléments numériques à des tests et examens
            de sécurité efficaces;
    - urn: urn:intuitem:risk:req_node:cra-resolution-annexes:1.2.4
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:cra-resolution-annexes:node20
      ref_id: 1.2.4
      description: once a security update has been made available, share and publicly disclose information about
        fixed vulnerabilities, including a description of the vulnerabilities, information allowing users to identify
        the product with digital elements affected, the impacts of the vulnerabilities, their severity and clear
        and accessible information helping users to remediate the vulnerabilities; in duly justified cases, where
        manufacturers consider the security risks of publication to outweigh the security benefits, they may delay
        making public information regarding a fixed vulnerability until after users have been given the possibility
        to apply the relevant patch;
      translations:
        de:
          description: sobald eine Sicherheitsaktualisierung bereitgestellt worden ist, Informationen über beseitigte
            Schwachstellen teilen und veröffentlichen, einschließlich einer Beschreibung der Schwachstellen mit
            Angaben, anhand deren die Nutzer das betroffene Produkt mit digitalen Elementen, die Auswirkungen der
            Schwachstellen und ihre Schwere erkennen können, sowie eindeutige und verständliche Informationen, die
            den Nutzern helfen, die Schwachstellen zu beheben; in hinreichend begründeten Fällen, in denen die Hersteller
            der Auffassung sind, dass die Risiken der Veröffentlichung die Vorteile in Bezug auf die Sicherheit
            überwiegen, können sie die Veröffentlichung von Informationen über eine behobene Schwachstelle so lange
            aufschieben, bis den Nutzern die Möglichkeit gegeben wurde, den entsprechenden Patch anzuwenden;
        fr:
          description: dès la publication d’une mise à jour de sécurité, communiquent sur les vulnérabilités corrigées,
            en publiant notamment une description des vulnérabilités, des informations permettant aux utilisateurs
            d’identifier le produit comportant des éléments numérique concerné, les conséquences de ces vulnérabilités,
            leur gravité et des informations claires et accessibles aidant les utilisateurs à y remédier; dans des
            cas dûment justifiés, lorsque les fabricants considèrent que les risques pour la sécurité liés à la
            publication l’emportent sur les avantages en matière de sécurité, ils peuvent retarder la publication
            des informations relatives à une vulnérabilité corrigée jusqu’à ce que les utilisateurs aient eu la
            possibilité d’appliquer le correctif adapté;
    - urn: urn:intuitem:risk:req_node:cra-resolution-annexes:1.2.5
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:cra-resolution-annexes:node20
      ref_id: 1.2.5
      description: put in place and enforce a policy on coordinated vulnerability disclosure;
      translations:
        de:
          description: eine Strategie für die koordinierte Offenlegung von Schwachstellen aufstellen und umsetzen;
        fr:
          description: mettent en place et appliquent une politique de divulgation coordonnée des vulnérabilités;
    - urn: urn:intuitem:risk:req_node:cra-resolution-annexes:1.2.6
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:cra-resolution-annexes:node20
      ref_id: 1.2.6
      description: take measures to facilitate the sharing of information about potential vulnerabilities in their
        product with digital elements as well as in third-party components contained in that product, including
        by providing a contact address for the reporting of the vulnerabilities discovered in the product with digital
        elements;
      translations:
        de:
          description: Maßnahmen ergreifen, um den Austausch von Informationen über mögliche Schwachstellen in ihrem
            Produkt mit digitalen Elementen und darin enthaltenen Komponenten Dritter zu erleichtern, und dazu u.
            a. eine Kontaktadresse für die Meldung der in dem Produkt mit digitalen Elementen entdeckten Schwachstellen
            angeben;
        fr:
          description: prennent des mesures pour faciliter le partage d’informations sur les vulnérabilités potentielles
            de leurs produits comportant des éléments numériques ainsi que des composants tiers contenus dans ces
            produits, y compris en fournissant une adresse de contact pour le signalement des vulnérabilités découvertes
            dans les produits concernés;
    - urn: urn:intuitem:risk:req_node:cra-resolution-annexes:1.2.7
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:cra-resolution-annexes:node20
      ref_id: 1.2.7
      description: provide for mechanisms to securely distribute updates for products with digital elements to ensure
        that vulnerabilities are fixed or mitigated in a timely manner and, where applicable for security updates,
        in an automatic manner;
      translations:
        de:
          description: Mechanismen für die sichere Verbreitung von Aktualisierungen für Produkte mit digitalen Elementen
            bereitstellen, damit Schwachstellen rechtzeitig und im Falle von Sicherheitsaktualisierungen gegebenenfalls
            automatisch behoben oder eingedämmt werden;
        fr:
          description: prévoient des mécanismes de distribution sécurisée des mises à jour pour les produits comportant
            des éléments numériques afin de garantir que les vulnérabilités soient corrigées ou atténuées rapidement
            et, le cas échéant, automatisent les mises à jour de sécurité;
    - urn: urn:intuitem:risk:req_node:cra-resolution-annexes:1.2.8
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:cra-resolution-annexes:node20
      ref_id: 1.2.8
      description: ensure that, where security updates are available to address identified security issues, they
        are disseminated without delay and, unless otherwise agreed between a manufacturer and a business user in
        relation to a tailor-made product with digital elements, free of charge, accompanied by advisory messages
        providing users with the relevant information, including on potential action to be taken.
      translations:
        de:
          description: dafür sorgen, dass Sicherheitsaktualisierungen, die zur Bewältigung festgestellter Sicherheitsprobleme
            zur Verfügung stehen, unverzüglich und — sofern zwischen dem Hersteller und dem gewerblichen Nutzer
            in Bezug auf ein maßgeschneidertes Produkt mit digitalen Elementen nichts anderes vereinbart wurde —
            kostenlos verbreitet werden, zusammen mit Hinweisen und einschlägigen Informationen, auch über zu treffende
            mögliche Maßnahmen.
        fr:
          description: veillent à ce que, lorsque des correctifs ou des mises à jour de sécurité sont disponibles
            pour remédier à des problèmes de sécurité constatés, ils soient diffusés sans retard et, sauf accord
            contraire entre un fabricant et un utilisateur professionnel en ce qui concerne un produit sur mesure
            comportant des éléments numériques, gratuitement et accompagnées de messages consultatifs fournissant
            aux utilisateurs les informations pertinentes, y compris sur les éventuelles mesures à prendre.
    - urn: urn:intuitem:risk:req_node:cra-resolution-annexes:2
      assessable: false
      depth: 1
      ref_id: '2'
      name: ANNEX II
      description: INFORMATION AND INSTRUCTIONS TO THE USER
      translations:
        de:
          name: ANHANG II
          description: INFORMATIONEN UND ANLEITUNGEN FÜR DEN NUTZER
        fr:
          name: ANNEXE II
          description: INFORMATIONS ET INSTRUCTIONS DESTINÉES À L’UTILISATEUR
    - urn: urn:intuitem:risk:req_node:cra-resolution-annexes:node30
      assessable: false
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:cra-resolution-annexes:2
      description: 'At minimum, the product with digital elements shall be accompanied by:'
      translations:
        de:
          description: 'Dem Produkt mit digitalen Elementen muss mindestens Folgendes beigefügt sein:'
        fr:
          description: 'Le produit comportant des éléments numériques doit au moins être accompagné des informations
            et instructions suivantes:'
    - urn: urn:intuitem:risk:req_node:cra-resolution-annexes:2.1
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:cra-resolution-annexes:node30
      ref_id: '2.1'
      description: the name, registered trade name or registered trademark of the manufacturer, and the postal address,
        the email address or other digital contact as well as, where available, the website at which the manufacturer
        can be contacted;
      translations:
        de:
          description: Name, eingetragener Handelsname oder eingetragene Handelsmarke des Herstellers, die Postanschrift,
            E-Mail-Adresse oder andere digitale Kontaktmöglichkeit und, falls vorhanden, Website, unter denen der
            Hersteller erreichbar ist;
        fr:
          description: le nom, la raison sociale ou la marque déposée du fabricant et l’adresse postale, l’adresse
            électronique ou tout autre contact numérique ainsi que, le cas échéant, le site internet sur lequel
            le fabricant peut être contacté;
    - urn: urn:intuitem:risk:req_node:cra-resolution-annexes:2.2
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:cra-resolution-annexes:node30
      ref_id: '2.2'
      description: the single point of contact where information about vulnerabilities of the product with digital
        elements can be reported and received, and where the manufacturer’s policy on coordinated vulnerability
        disclosure can be found;
      translations:
        de:
          description: die zentrale Kontaktstelle, bei der Informationen über Schwachstellen des Produkts mit digitalen
            Elementen gemeldet werden können und entgegengenommen werden und das Konzept für die koordinierte Offenlegung
            von Schwachstellen zu finden ist;
        fr:
          description: le point de contact unique où les informations sur les vulnérabilités du produit comportant
            des éléments numériques peuvent être signalées et reçues, et où peut être trouvée la politique du fabricant
            en matière de divulgation coordonnée des vulnérabilités;
    - urn: urn:intuitem:risk:req_node:cra-resolution-annexes:2.3
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:cra-resolution-annexes:node30
      ref_id: '2.3'
      description: name and type and any additional information enabling the unique identification of the product
        with digital elements;
      translations:
        de:
          description: Name und Typ sowie alle zusätzlichen Informationen, die eine eindeutige Identifizierung des
            Produkts mit digitalen Elementen ermöglichen;
        fr:
          description: nom et type, ainsi que toute information supplémentaire permettant l’identification unique
            du produit comportant des éléments numériques;
    - urn: urn:intuitem:risk:req_node:cra-resolution-annexes:2.4
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:cra-resolution-annexes:node30
      ref_id: '2.4'
      description: the intended purpose of the product with digital elements, including the security environment
        provided by the manufacturer, as well as the product’s essential functionalities and information about the
        security properties;
      translations:
        de:
          description: die Zweckbestimmung des Produkts mit digitalen Elementen, einschließlich des vom Hersteller
            bereitgestellten Sicherheitsumfelds, sowie die Hauptfunktionen des Produkts und Informationen über die
            Sicherheitseigenschaften;
        fr:
          description: l’utilisation prévue du produit comportant des éléments numériques, y compris l’environnement
            de sécurité fourni par le fabricant, ainsi que les fonctionnalités essentielles du produit et les informations
            sur ses propriétés de sécurité;
    - urn: urn:intuitem:risk:req_node:cra-resolution-annexes:2.5
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:cra-resolution-annexes:node30
      ref_id: '2.5'
      description: any known or foreseeable circumstance, related to the use of the product with digital elements
        in accordance with its intended purpose or under conditions of reasonably foreseeable misuse, which may
        lead to significant cybersecurity risks;
      translations:
        de:
          description: alle bekannten oder vorhersehbaren Umstände im Zusammenhang mit der Zweckbestimmung des Produkts
            mit digitalen Elementen oder dessen vernünftigerweise vorhersehbaren Fehlanwendung, die zu erheblichen
            Cybersicherheitsrisiken führen können;
        fr:
          description: toutes circonstances connues ou prévisibles liées à l’utilisation du produit comportant des
            éléments numériques conformément à son utilisation prévue ou dans des conditions de mauvaise utilisation
            raisonnablement prévisible, susceptibles d’entraîner des risques de cybersécurité importants;
    - urn: urn:intuitem:risk:req_node:cra-resolution-annexes:2.6
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:cra-resolution-annexes:node30
      ref_id: '2.6'
      description: where applicable, the internet address at which the EU declaration of conformity can be accessed;
      translations:
        de:
          description: gegebenenfalls die Internetadresse, unter der die EU-Konformitätserklärung abrufbar ist;
        fr:
          description: le cas échéant, l’adresse internet à laquelle la déclaration UE de conformité peut être consultée;
    - urn: urn:intuitem:risk:req_node:cra-resolution-annexes:2.7
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:cra-resolution-annexes:node30
      ref_id: '2.7'
      description: the type of technical security support offered by the manufacturer and the end-date of the support
        period during which users can expect vulnerabilities to be handled and to receive security updates;
      translations:
        de:
          description: die Art der vom Hersteller angebotenen technischen Sicherheitsunterstützung und das Enddatum
            des Unterstützungszeitraums, in dem die Nutzer die Behebung von Schwachstellen und den Erhalt von Sicherheitsaktualisierungen
            erwarten können;
        fr:
          description: le type d’assistance technique en matière de sécurité proposé par le fabricant et la date
            de fin de la période d’assistance pendant laquelle les utilisateurs peuvent s’attendre à recevoir des
            mises à jour de sécurité;
    - urn: urn:intuitem:risk:req_node:cra-resolution-annexes:2.8
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:cra-resolution-annexes:node30
      ref_id: '2.8'
      description: 'detailed instructions or an internet address referring to such detailed instructions and information
        on:'
      translations:
        de:
          description: ausführliche Anleitungen oder eine Internetadresse, unter der auf solche ausführlichen Anleitungen
            und Informationen verwiesen wird, dazu,
        fr:
          description: 'des instructions détaillées ou une adresse internet renvoyant à des instructions détaillées
            et informations sur:'
    - urn: urn:intuitem:risk:req_node:cra-resolution-annexes:2.8.a
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:cra-resolution-annexes:2.8
      ref_id: 2.8.a
      description: the necessary measures during initial commissioning and throughout the lifetime of the product
        with digital elements to ensure its secure use;
      translations:
        de:
          description: welche Maßnahmen bei der ersten Inbetriebnahme und während der gesamten Lebensdauer des Produkts
            mit digitalen Elementen getroffen werden müssen, um dessen sichere Verwendung sicherzustellen,
        fr:
          description: les mesures nécessaires lors de la mise en service initiale du produit comportant des éléments
            numériques et pendant toute sa durée de vie pour assurer sa sécurité d’utilisation;
    - urn: urn:intuitem:risk:req_node:cra-resolution-annexes:2.8.b
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:cra-resolution-annexes:2.8
      ref_id: 2.8.b
      description: how changes to the product with digital elements can affect the security of data;
      translations:
        de:
          description: wie sich Änderungen am Produkt mit digitalen Elementen auf die Datensicherheit auswirken
            können,
        fr:
          description: la façon dont les modifications apportées au produit comportant des éléments numériques peuvent
            affecter la sécurité des données;
    - urn: urn:intuitem:risk:req_node:cra-resolution-annexes:2.8.c
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:cra-resolution-annexes:2.8
      ref_id: 2.8.c
      description: how security-relevant updates can be installed;
      translations:
        de:
          description: wie sicherheitsrelevante Aktualisierungen installiert werden können,
        fr:
          description: la façon dont les mises à jour pertinentes pour la sécurité peuvent être installées;
    - urn: urn:intuitem:risk:req_node:cra-resolution-annexes:2.8.d
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:cra-resolution-annexes:2.8
      ref_id: 2.8.d
      description: the secure decommissioning of the product with digital elements, including information on how
        user data can be securely removed;
      translations:
        de:
          description: wie eine sichere Außerbetriebnahme des Produkts mit digitalen Elementen erfolgt und wie Nutzerdaten
            sicher entfernt werden können;
        fr:
          description: la mise hors service sécurisée du produit comportant des éléments numériques, en ce compris
            des informations sur la manière dont les données utilisateur peuvent être supprimées en toute sécurité;
    - urn: urn:intuitem:risk:req_node:cra-resolution-annexes:2.8.e
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:cra-resolution-annexes:2.8
      ref_id: 2.8.e
      description: how the default setting enabling the automatic installation of security updates, as required
        by Part I, point (2)(c), of Annex I, can be turned off;
      translations:
        de:
          description: wie die Standardeinstellung, die die automatische Installation von Sicherheitsaktualisierungen
            gemäß Anhang I Teil I Buchstabe c ermöglicht, deaktiviert werden kann;
        fr:
          description: la manière dont le réglage par défaut permettant l’installation automatique des mises à jour
            de sécurité, conformément à l’annexe I, partie I, point c), peut être désactivé;
    - urn: urn:intuitem:risk:req_node:cra-resolution-annexes:2.8.f
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:cra-resolution-annexes:2.8
      ref_id: 2.8.f
      description: where the product with digital elements is intended for integration into other products with
        digital elements, the information necessary for the integrator to comply with the essential cybersecurity
        requirements set out in Annex I and the documentation requirements set out in Annex VII.
      translations:
        de:
          description: wie der Integrator die grundlegenden Cybersicherheitsanforderungen in Anhang I und die Anforderungen
            an die technische Dokumentation in Anhang VII erfüllen kann, wenn das Produkt mit digitalen Elementen
            für die Integration in andere Produkte mit digitalen Elementen bestimmt ist;
        fr:
          description: lorsque le produit comportant des éléments numériques est destiné à être intégré dans d’autres
            produits comportant des éléments numériques, les informations nécessaires à l’intégrateur pour se conformer
            aux exigences essentielles de cybersécurité énoncées à l’annexe I et aux exigences en matière de documentation
            énoncées à l’annexe VII;
    - urn: urn:intuitem:risk:req_node:cra-resolution-annexes:2.9
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:cra-resolution-annexes:node30
      ref_id: '2.9'
      description: If the manufacturer decides to make available the software bill of materials to the user, information
        on where the software bill of materials can be accessed.
      translations:
        de:
          description: für den Fall, dass der Hersteller dem Nutzer die Software-Stückliste zur Verfügung stellt,
            wo auf die Software-Stückliste zugegriffen werden kann.
        fr:
          description: lorsque le fabricant décide de mettre à la disposition de l’utilisateur la nomenclature des
            logiciels, des informations sur l’endroit où celle-ci peut être consultée.
    - urn: urn:intuitem:risk:req_node:cra-resolution-annexes:3
      assessable: false
      depth: 1
      ref_id: '3'
      name: ANNEX III
      description: IMPORTANT PRODUCTS WITH DIGITAL ELEMENTS
      translations:
        de:
          name: ANHANG III
          description: WICHTIGE PRODUKTE MIT DIGITALEN ELEMENTEN
        fr:
          name: ANNEXE III
          description: PRODUITS IMPORTANTS COMPORTANT DES ÉLÉMENTS NUMÉRIQUES
    - urn: urn:intuitem:risk:req_node:cra-resolution-annexes:3.1
      assessable: false
