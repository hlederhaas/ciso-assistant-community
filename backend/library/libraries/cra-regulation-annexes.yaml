        fr:
          description: Navigateurs autonomes et intégrés
    - urn: urn:intuitem:risk:req_node:cra-resolution-annexes:3.1.3
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:cra-resolution-annexes:3.1
      ref_id: 3.1.3
      description: Password managers
      translations:
        de:
          description: Passwort-Manager
        fr:
          description: Gestionnaires de mots de passe
    - urn: urn:intuitem:risk:req_node:cra-resolution-annexes:3.1.4
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:cra-resolution-annexes:3.1
      ref_id: 3.1.4
      description: Software that searches for, removes, or quarantines malicious software
      translations:
        de:
          description: Software für die Suche, Entfernung und Quarantäne von Schadsoftware
        fr:
          description: Logiciels qui recherchent, suppriment ou mettent en quarantaine des logiciels malveillants
    - urn: urn:intuitem:risk:req_node:cra-resolution-annexes:3.1.5
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:cra-resolution-annexes:3.1
      ref_id: 3.1.5
      description: Products with digital elements with the function of virtual private network (VPN)
      translations:
        de:
          description: Produkte mit digitalen Elementen mit der Funktion eines virtuellen privaten Netzes (VPN)
        fr:
          description: Produits comportant des éléments numériques avec la fonction de réseau privé virtuel (VPN)
    - urn: urn:intuitem:risk:req_node:cra-resolution-annexes:3.1.6
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:cra-resolution-annexes:3.1
      ref_id: 3.1.6
      description: Network management systems
      translations:
        de:
          description: Netzmanagementsysteme
        fr:
          description: Systèmes de gestion de réseau
    - urn: urn:intuitem:risk:req_node:cra-resolution-annexes:3.1.7
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:cra-resolution-annexes:3.1
      ref_id: 3.1.7
      description: Security information and event management (SIEM) systems
      translations:
        de:
          description: Systeme für die Verwaltung von Sicherheitsinformationen und -ereignissen (SIEM)
        fr:
          description: Systèmes de gestion des informations et des événements de sécurité (SIEM)
    - urn: urn:intuitem:risk:req_node:cra-resolution-annexes:3.1.8
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:cra-resolution-annexes:3.1
      ref_id: 3.1.8
      description: Boot managers
      translations:
        de:
          description: Bootmanager
        fr:
          description: Gestionnaires de démarrage
    - urn: urn:intuitem:risk:req_node:cra-resolution-annexes:3.1.9
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:cra-resolution-annexes:3.1
      ref_id: 3.1.9
      description: Public key infrastructure and digital certificate issuance software
      translations:
        de:
          description: Public-Key-Infrastrukturen und Software für die Ausstellung digitaler Zertifikate
        fr:
          description: Infrastructure à clé publique et logiciels d’émission de certificats numériques
    - urn: urn:intuitem:risk:req_node:cra-resolution-annexes:3.1.9'
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:cra-resolution-annexes:3.1
      ref_id: 3.1.9'
      description: Physical and virtual network interfaces
      translations:
        de:
          description: physische und virtuelle Netzschnittstellen
        fr:
          description: Interfaces réseau physiques et virtuelles
    - urn: urn:intuitem:risk:req_node:cra-resolution-annexes:3.1.10
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:cra-resolution-annexes:3.1
      ref_id: 3.1.10
      description: Operating systems
      translations:
        de:
          description: Betriebssysteme
        fr:
          description: Systèmes d’exploitation
    - urn: urn:intuitem:risk:req_node:cra-resolution-annexes:3.1.11
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:cra-resolution-annexes:3.1
      ref_id: 3.1.11
      description: Routers, modems intended for the connection to the internet, and switches
      translations:
        de:
          description: Router, Modems für die Internetanbindung und Switches
        fr:
          description: Routeurs, modems destinés à la connexion à l’internet et commutateurs
    - urn: urn:intuitem:risk:req_node:cra-resolution-annexes:3.1.12
